spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carebridge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  refresh-expiration: 604800000

onboarding:
  registration-key: ${ONBOARDING_REGISTRATION_KEY:local-onboarding-key}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.carebridge: DEBUG