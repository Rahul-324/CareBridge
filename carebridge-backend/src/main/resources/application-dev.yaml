spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carebridge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.carebridge: DEBUG