spring:
  application:
    name: carebridge-backend

  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:local-secret-key-carebridge-super-secure-32bytes}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

onboarding:
  registration-key: ${ONBOARDING_REGISTRATION_KEY:local-onboarding-key}

staff:
  invite-expiration: ${STAFF_INVITE_EXPIRATION:259200000}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  login:
    max-attempts: ${RATE_LIMIT_LOGIN_MAX:5}
    window-ms: ${RATE_LIMIT_LOGIN_WINDOW_MS:60000}
  onboarding:
    max-attempts: ${RATE_LIMIT_ONBOARDING_MAX:10}
    window-ms: ${RATE_LIMIT_ONBOARDING_WINDOW_MS:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized
