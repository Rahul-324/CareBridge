spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/carebridge_test_db}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

jwt:
  secret: ${JWT_SECRET:carebridge-test-jwt-secret-key-32b}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

onboarding:
  registration-key: ${ONBOARDING_REGISTRATION_KEY:test-onboarding-key}

staff:
  invite-expiration: 259200000

rate-limit:
  enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.carebridge: INFO