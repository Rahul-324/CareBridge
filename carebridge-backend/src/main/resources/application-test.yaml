spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/carebridge_test_db}
    username: ${TEST_DB_USERNAME:postgres}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.carebridge: INFO