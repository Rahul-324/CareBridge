version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carebridge_db
    environment:
      POSTGRES_DB: carebridge_prod_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_prod_secret}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carebridge_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/carebridge_prod_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_prod_secret}
      JWT_SECRET: ${JWT_SECRET:-carebridge-prod-jwt-secret-key-must-be-min-32-chars!}
      ONBOARDING_REGISTRATION_KEY: ${ONBOARDING_REGISTRATION_KEY:-carebridge-prod-onboarding-secret-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
